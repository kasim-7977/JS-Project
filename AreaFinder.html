<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Finder</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(to bottom, lightgreen, lightblue);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 350px;
        }
        .Area {
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: bold;
            font-size: 1.1rem;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            color: #333;
        }
        .submit {
            padding: 8px;
            border-radius: 5px;
            color: white;
            background-color: lightskyblue;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit:hover {
            background-color: #64b5f6;
        }
        .value {
            margin: 5px 0 0 0;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Area Finder</h1>
        
        <!-- Square Shape Section -->
        <div class="Area" data-shape="square">
            <label>Square:</label>
            <input type="number" placeholder="Enter Side Length">
            <p class="value"></p>
            <button class="submit">Calculate</button>
        </div>
        
        <!-- Rectangle Shape Section -->
        <div class="Area" data-shape="rectangle">
            <label>Rectangle:</label>
            <input type="number" placeholder="Enter Length">
            <input type="number" placeholder="Enter Width">
            <p class="value"></p>
            <button class="submit">Calculate</button>
        </div>
    </div>

    <script>
        const areaBoxes = document.querySelectorAll('.Area');

        areaBoxes.forEach(box => {
            const inputs = box.querySelectorAll('input[type="number"]');
            const valueDisplay = box.querySelector('.value');
            const submitBtn = box.querySelector('.submit');
            const shapeType = box.getAttribute('data-shape');

            submitBtn.addEventListener('click', () => {
                if (shapeType === 'square') {
                    const side = parseFloat(inputs[0].value);
                    if (isNaN(side) || side <= 0) {
                        valueDisplay.textContent = 'Please enter a valid side length.';
                        return;
                    }
                    const area = side * side;
                    valueDisplay.textContent = `Area: ${area}`;
                } 
                else if (shapeType === 'rectangle') {
                    const length = parseFloat(inputs[0].value);
                    const width = parseFloat(inputs[1].value);
                    if (isNaN(length) || isNaN(width) || length <= 0 || width <= 0) {
                        valueDisplay.textContent = 'Please enter valid dimensions.';
                        return;
                    }
                    const area = length * width;
                    valueDisplay.textContent = `Area: ${area}`;
                }
            });
        });
    </script>
</body>
</html>
