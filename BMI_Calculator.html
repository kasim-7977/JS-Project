<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>BMI CALCULATOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script> 
    <style>
        body{
            color: azure;
            margin: 0;
            background:linear-gradient(to bottom, lightblue, darkblue);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container{
            background:linear-gradient(to top, lightblue, darkblue); 
            box-shadow: 0 10px 10px rgba(0,0,0,.3);
            padding: 20px;
            border-radius: 10px;
        }
        .content{
            padding: 10px;
        }
        #bmivalue{
            margin-top: 10px;
        }
        h2{
            -webkit-text-stroke: 1px black;
        }
        input{
            padding: 5px;
            margin: 10px;
            align-content:start;
            border-radius: 3px;
        }
        button{
            padding:10px;
            width: 200px;
        }
        .category {
        /* Coordinates name, duration (1s), timing function, and loops infinitely */
        animation: sharp-blink 1s steps(1, end) infinite; 
        }

        @keyframes sharp-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="container col-6">
        <h2>Body Mass Index [BMI] Calculator</h2>
        <div class="content">
        <label for="Name">Enter Your Name:</label><br>
        <input type="text" placeholder="Enter Your Name" id="Name">
        </div>
        <div class="content">
        <label for="Height">Enter Your Height In cm[centi meter]:</label><br>
        <input type="number" placeholder="Enter Your Height In cm" id="Height" >
        </div>
        <div class="content">
        <label for="weight">Enter Your Weight:</label><br>
        <input type="text" placeholder="Enter Your Weight" id="Weight">
        </div>
        <div class="content">
        <button class="button" onclick="calculate()">
            Compute Your BMI
        </button><br>
        <input id="bmivalue" type="number">
        </div>
        <p id="print"></p>
    </div>
    <script>
        const nameE1 = document.getElementById("Name");
        const heightE1 = document.getElementById("Height");
        const weightE1 = document.getElementById("Weight");
        const valueE1 = document.getElementById("bmivalue");

        function calculate(){
        const height = +heightE1.value / 100; // convert cm to meters
        const weight = +weightE1.value;

        if (!height || !weight || height <= 0 || weight <= 0){
        alert("Please enter valid height and weight values.");
        return;
        }

        const bmi = weight / (height * height);
        valueE1.value = bmi.toFixed(2);

        if(bmi<18.5)
        {
            document.getElementById("print").innerHTML=`Hi ${nameE1.value} Your Weight Categorie is <span class="category">Under Weight </span>`;
        }
        else if(bmi>=18.5 && bmi<=24.9){
            document.getElementById("print").innerHTML=`Hi ${nameE1.value} Your Weight Categorie is <span class="category">Healthy Weight</span>`;
        }
        else if(bmi>=25.0 && bmi <=29.9){
            document.getElementById("print").innerHTML=`Hi ${nameE1.value} Your Weight Categorie is <span class="category">Over Weight</span>`;
        }
        else{
            document.getElementById("print").innerHTML=`Hi ${nameE1.value} Your Weight Categorie is <span class="category">Obesity</span>`;
        }
}
    </script>
</body>
</html>
